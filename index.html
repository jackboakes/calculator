<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/script.js" defer></script>
</head>
<body>
    <div class="calculator-container">
        <p class="display-text">8008</p>
        <div class="button-container">
            <!-- Row 1 -->
            
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button id="delete">Del</button>
            <button id="clear">Clear</button>
            <!-- Row 2 -->
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>×</button>
            <button>÷</button>
            <!-- Row 3 -->
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <button>−</button>

            <!-- Row 4 -->
            <button>0</button>
            <button>.</button>
            <div class="button-spacer"></div>
            <div class="button-spacer"></div>
            <button id="equals">=</button>
        </div>
    </div>


</body>
</html>
